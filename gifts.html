<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Gifts 🎁</title>

<style>
body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    text-align: center;
    background: linear-gradient(135deg, #ff9a9e, #fad0c4);
}

/* Title */
h1 {
    margin-top: 20px;
    color: #333;
}

/* Gift container */
.gift-container {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
    gap: 20px;
    padding: 30px;
    max-width: 700px;
    margin: auto;
}

/* Gift box */
.gift {
    background: #ff6b81;
    border-radius: 15px;
    padding: 30px;
    cursor: pointer;
    color: white;
    font-size: 40px;
    transition: 0.3s;
    position: relative;
}

.gift:hover {
    transform: scale(1.1);
}

/* Opened gift */
.opened {
    background: white;
    color: #333;
    font-size: 14px;
    padding: 15px;
}

/* Message */
.message {
    margin-top: 10px;
    font-size: 14px;
}
</style>
</head>

<body>

<h1>🎂 Here is your birthday gift, choose them 🎁</h1>

<div class="gift-container">

    <div class="gift" onclick="openGift(this, 0)">🎁</div>
    <div class="gift" onclick="openGift(this, 1)">🎁</div>
    <div class="gift" onclick="openGift(this, 2)">🎁</div>
    <div class="gift" onclick="openGift(this, 3)">🎁</div>
    <div class="gift" onclick="openGift(this, 4)">🎁</div>
    <div class="gift" onclick="openGift(this, 5)">🎁</div>
    <div class="gift" onclick="openGift(this, 5)">🎁</div>

</div>

<script>
const giftMessages = [
    "You make everything better ❤️",
    "Still wondering how you look this good 😳",
    "You are my favorite distraction 😌",
    "Talking to you = best part of my day 💬",
    "You are cute… don’t argue 😏",
    "Honestly… I’m lucky to have you 💖"
];

function openGift(element, index) {
    if (element.classList.contains("opened")) return;

    element.classList.add("opened");
    element.innerHTML = `
        <div>🎉</div>
        <div class="message">${giftMessages[index]}</div>
    `;
}
</script>

</body>
</html>
