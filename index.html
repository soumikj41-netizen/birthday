<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Happy Birthday ❤️</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
    body {
        margin: 0;
        font-family: 'Poppins', sans-serif;
        background: linear-gradient(135deg, #ff9a9e, #fad0c4);
        text-align: center;
        color: #333;
    }

    h1 {
        margin-top: 20px;
        font-size: 2.5rem;
    }

    .container {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
        gap: 15px;
        padding: 20px;
        max-width: 800px;
        margin: auto;
    }

    .card {
        background: white;
        border-radius: 15px;
        padding: 20px;
        cursor: pointer;
        box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        transition: 0.3s;
    }

    .card:hover {
        transform: scale(1.05);
    }

    .message-box {
        margin-top: 20px;
        padding: 20px;
        background: white;
        border-radius: 15px;
        width: 70%;
        margin-left: auto;
        margin-right: auto;
        display: none;
        box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }

    button {
        margin-top: 30px;
        padding: 10px 20px;
        border: none;
        border-radius: 10px;
        background: #ff6b81;
        color: white;
        font-size: 16px;
        cursor: pointer;
    }

    button:hover {
        background: #ff4757;
    }
    .photo-section {
    display: flex;
    justify-content: center;
    gap: 15px;
    flex-wrap: wrap;
    margin: 20px;
}

.photo-card {
    width: 150px;
    height: 200px;
    border-radius: 15px;
    overflow: hidden;
    box-shadow: 0 5px 15px rgba(0,0,0,0.3);
    transition: 0.3s;
}

.photo-card img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.photo-card:hover {
    transform: scale(1.1) rotate(-2deg);
}

/* 📱 Mobile Responsive */
@media (max-width: 600px) {

    h1 {
        font-size: 1.8rem;
        padding: 0 10px;
    }

    p {
        font-size: 1rem;
    }

    .container,
    .gift-container {
        grid-template-columns: repeat(2, 1fr);
        padding: 10px;
        gap: 10px;
    }

    .card, .gift {
        padding: 15px;
        font-size: 16px;
    }

    .message-box {
        width: 90%;
        font-size: 16px;
    }

    button {
        font-size: 14px;
        padding: 10px 15px;
    }
}
</style>
</head>

<body>

<h2> ❤️Happy Birthday❤️ </h2>
<h1><b>Shilpa</b></h1>

<div class="photo-section">
    <div class="photo-card">
        <img src="photo1.jpg" alt="Her Photo">
    </div>
    <div class="photo-card">
        <img src="photo2.jpg" alt="Her Photo">
    </div>
    <div class="photo-card">
        <img src="photo3.png" alt="Her Photo">
    </div>
</div>
<p>Click each card 😏</p>

<div class="container">
    <div class="card" onclick="showMessage(0)">1</div>
    <div class="card" onclick="showMessage(1)">2</div>
    <div class="card" onclick="showMessage(2)">3</div>
    <div class="card" onclick="showMessage(3)">4</div>
    <div class="card" onclick="showMessage(4)">5</div>
    <div class="card" onclick="showMessage(5)">6</div>
    <div class="card" onclick="showMessage(6)">7</div>
    <div class="card" onclick="showMessage(7)">8</div>
</div>
<div id="messageBox" class="message-box"></div>

<button onclick="goNext()">Next ➡️</button>


<script>
    function goNext() {
    window.location.href = "chat.html";
}
const messages = [
    "You are cute… but also very annoying sometimes 😌",
    "I still don’t understand how someone can talk THIS much 😂",
    "You make my day better… even when you irritate me 🙄❤️",
    "Your smile is dangerous… seriously 😳",
    "You act innocent but I know your real side 😏",
    "Talking to you is my favorite habit 💬",
    "You are weird… but my favorite kind of weird 🫶",
    "Honestly… life feels nicer with you in it ❤️"
];

function showMessage(index) {
    const box = document.getElementById("messageBox");
    box.style.display = "block";
    box.innerText = messages[index];
}

function finalMessage() {
    const box = document.getElementById("messageBox");
    box.style.display = "block";
    box.innerText = "Okay jokes apart… 💖\n\nYou are truly special to me. I’m really lucky to have you in my life.\n\nHappy Birthday ❤️🎂\nStay the same always ✨";
}
</script>

</body>
</html>
